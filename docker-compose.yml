version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - video-uploads:/app/uploads
      - ./backend/models:/app/models
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - MODEL_PATH=/app/models/RefInightmodel.pth
      - UPLOAD_DIR=/app/uploads
    networks:
      - app-network

volumes:
  video-uploads:
    driver: local

networks:
  app-network:
    driver: bridge 